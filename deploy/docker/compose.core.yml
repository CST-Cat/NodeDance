services:
  core:
    image: ${NODEDANCE_CORE_IMAGE:-nodedance-core:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.core
      args:
        VERSION: ${CORE_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${CORE_BIND_ADDRESS:-127.0.0.1}:${CORE_PORT:-8180}:8180"
    volumes:
      - core-data:/var/lib/nodedance
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  core-data:
