services:
  web:
    image: ${ND_NGINX_IMAGE}
    ports:
      - "127.0.0.1:18081:80/tcp"
    volumes:
      - ./bind-data:/usr/share/nginx/html:ro
    labels:
      io.nodedance.test: "true"
      io.nodedance.suite: ${NODEDANCE_TEST_RUN_ID}
      com.nodedance.fixture: "web"
    networks:
      - nd-internal
  data:
    image: ${ND_REDIS_IMAGE}
    command: ["redis-server", "--appendonly", "yes"]
    env_file:
      - .env
    volumes:
      - nd-demo-data:/data
    labels:
      io.nodedance.test: "true"
      io.nodedance.suite: ${NODEDANCE_TEST_RUN_ID}
      com.nodedance.fixture: "data"
    networks:
      - nd-internal
  optional-worker:
    image: ${ND_BUSYBOX_IMAGE}
    profiles: ["demo-worker"]
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    labels:
      io.nodedance.test: "true"
      io.nodedance.suite: ${NODEDANCE_TEST_RUN_ID}
      com.nodedance.fixture: "optional-worker"
    networks:
      - nd-internal
volumes:
  nd-demo-data:
    labels:
      io.nodedance.test: "true"
      io.nodedance.suite: ${NODEDANCE_TEST_RUN_ID}
networks:
  nd-internal:
    labels:
      io.nodedance.test: "true"
      io.nodedance.suite: ${NODEDANCE_TEST_RUN_ID}
