name: Agent release

on:
  push:
    tags:
      - 'agent-v*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate Agent tag and bilingual release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release-notes.py render agent "$RELEASE_VERSION" --output /tmp/agent-release-notes.md
          python3 -m unittest discover -s scripts/tests

      - name: Upload reviewed release notes
        uses: actions/upload-artifact@v4
        with:
          name: agent-release-notes
          path: /tmp/agent-release-notes.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: Agent native ${{ matrix.arch }} build and tests
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and execute native Agent artifact
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$(go env GOHOSTARCH)" == "$EXPECTED_ARCH" ]]
          [[ "$(go env GOARCH)" == "$EXPECTED_ARCH" ]]
          [[ "$(go env GOOS)" == linux ]]
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" -o "dist/nodedance-agent-linux-${EXPECTED_ARCH}" ./cmd/nodedance-agent
          [[ "$("dist/nodedance-agent-linux-${EXPECTED_ARCH}" --version)" == "NodeDance Agent ${RELEASE_VERSION}" ]]
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" -o "dist/nodedance-updater-linux-${EXPECTED_ARCH}" ./cmd/nodedance-updater
          [[ "$("dist/nodedance-updater-linux-${EXPECTED_ARCH}" --version)" == "NodeDance Updater ${RELEASE_VERSION}" ]]

      - name: Run native root Agent and shared contract tests
        run: |
          set -euo pipefail
          sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" \
            "$(command -v go)" test -count=1 ./internal/agent/... ./internal/protocol/... ./internal/i18n/... ./cmd/nodedance-agent/... ./internal/update/... ./cmd/nodedance-updater/...

      - name: Upload tested native Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-${{ matrix.arch }}
          path: |
            dist/nodedance-agent-linux-${{ matrix.arch }}
            dist/nodedance-updater-linux-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  image:
    name: Publish agent Docker image
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve lowercase image name
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY_OWNER,,}/nodedance-agent" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish version-pinned amd64 and arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=agent-image
          cache-to: type=gha,mode=max,scope=agent-image

  publish:
    name: Publish verified Agent release
    needs: [prepare, build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download native Agent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agent-linux-*
          path: dist
          merge-multiple: true

      - name: Download reviewed bilingual release notes
        uses: actions/download-artifact@v4
        with:
          name: agent-release-notes
          path: release-inputs

      - name: Package installer and generate checksums
        run: |
          set -euo pipefail
          chmod 0755 dist/nodedance-updater-linux-*
          dist/nodedance-updater-linux-amd64 manifest --component agent --version "${{ github.ref_name }}" > dist/nodedance-update.json
          cp scripts/install-updater.sh dist/install-updater.sh
          test -f dist/nodedance-agent-linux-amd64
          test -f dist/nodedance-agent-linux-arm64
          cp scripts/install-agent.sh dist/install-agent.sh
          chmod 0755 dist/install-agent.sh dist/nodedance-agent-linux-amd64 dist/nodedance-agent-linux-arm64
          (cd dist && sha256sum nodedance-agent-linux-amd64 nodedance-agent-linux-arm64 nodedance-updater-linux-amd64 nodedance-updater-linux-arm64 nodedance-update.json install-updater.sh > SHA256SUMS)

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" \
            dist/install-agent.sh \
            dist/nodedance-agent-linux-amd64 \
            dist/nodedance-agent-linux-arm64 \
            dist/nodedance-updater-linux-amd64 \
            dist/nodedance-updater-linux-arm64 \
            dist/nodedance-update.json \
            dist/install-updater.sh \
            dist/SHA256SUMS \
            --title "$RELEASE_VERSION" \
            --verify-tag \
            --latest=false \
            --notes-file release-inputs/agent-release-notes.md
