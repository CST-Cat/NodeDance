name: Agent release

on:
  push:
    tags:
      - 'agent-v*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate Agent tag and bilingual release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release-notes.py render agent "$RELEASE_VERSION" --output /tmp/agent-release-notes.md
          python3 -m unittest discover -s scripts/tests

      - name: Upload reviewed release notes
        uses: actions/upload-artifact@v4
        with:
          name: agent-release-notes
          path: /tmp/agent-release-notes.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: Agent native ${{ matrix.arch }} build, tests and image
    needs: prepare
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and execute native Agent artifact
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$(go env GOHOSTARCH)" == "$EXPECTED_ARCH" ]]
          [[ "$(go env GOARCH)" == "$EXPECTED_ARCH" ]]
          [[ "$(go env GOOS)" == linux ]]
          mkdir -p dist
          python3 scripts/vendor-tmux.py --check
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" -o "dist/nodedance-agent-linux-${EXPECTED_ARCH}" ./cmd/nodedance-agent
          [[ "$("dist/nodedance-agent-linux-${EXPECTED_ARCH}" --version)" == "NodeDance Agent ${RELEASE_VERSION}" ]]
          [[ "$("dist/nodedance-agent-linux-${EXPECTED_ARCH}" --tmux-version)" == "tmux 3.7c" ]]

      - name: Run native root Agent and shared contract tests
        run: |
          set -euo pipefail
          sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" \
            "$(command -v go)" test -count=1 ./internal/agent/... ./internal/protocol/... ./internal/i18n/... ./cmd/nodedance-agent/... ./internal/update/...
      - name: Verify bundled tmux Docker terminal bridge
        run: |
          set -euo pipefail
          sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" NODEDANCE_TEST_DOCKER=1 \
            "$(command -v go)" test -count=1 ./internal/agent/terminal -run TestBundledTmuxDocker -timeout 60s

      - name: Upload tested native Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-${{ matrix.arch }}
          path: |
            dist/nodedance-agent-linux-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Set up native image builder
        uses: docker/setup-buildx-action@v3

      - name: Resolve lowercase image name
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY_OWNER,,}/nodedance-agent" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package tested native artifacts and push by digest
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.agent
          target: release
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=min

      - name: Verify image contains the tested artifacts
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 scripts/release_images.py verify --component agent --architecture "$EXPECTED_ARCH" \
            --image "$IMAGE@$DIGEST" --version "$RELEASE_VERSION" --artifacts dist
          mkdir -p image-digests
          printf '%s\n' "$DIGEST" > "image-digests/$EXPECTED_ARCH"

      - name: Upload verified image digest
        uses: actions/upload-artifact@v4
        with:
          name: agent-image-${{ matrix.arch }}
          path: image-digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified Agent release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Require a passing release rehearsal
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release-rehearsal.py check agent "$RELEASE_VERSION"

      - name: Download native Agent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agent-linux-*
          path: dist
          merge-multiple: true

      - name: Download reviewed bilingual release notes
        uses: actions/download-artifact@v4
        with:
          name: agent-release-notes
          path: release-inputs

      - name: Package installer and generate checksums
        run: |
          set -euo pipefail
          test -f dist/nodedance-agent-linux-amd64
          test -f dist/nodedance-agent-linux-arm64
          chmod 0755 dist/nodedance-agent-linux-*
          cp scripts/install-agent.sh dist/install-agent.sh
          chmod 0755 dist/install-agent.sh dist/nodedance-agent-linux-amd64 dist/nodedance-agent-linux-arm64
          (cd dist && sha256sum nodedance-agent-linux-amd64 nodedance-agent-linux-arm64 > SHA256SUMS)

      - name: Download verified native image digests
        uses: actions/download-artifact@v4
        with:
          pattern: agent-image-*
          path: image-digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified multi-platform image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY_OWNER,,}/nodedance-agent"
          amd64=$(cat image-digests/amd64)
          arm64=$(cat image-digests/arm64)
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ && "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "$image:$RELEASE_VERSION" "$image@$amd64" "$image@$arm64"
          docker buildx imagetools inspect "$image:$RELEASE_VERSION"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" \
            dist/install-agent.sh \
            dist/nodedance-agent-linux-amd64 \
            dist/nodedance-agent-linux-arm64 \
            dist/SHA256SUMS \
            --title "$RELEASE_VERSION" \
            --verify-tag \
            --latest=false \
            --notes-file release-inputs/agent-release-notes.md

      - name: Publish the static latest-Agent version file
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Installers read this file through raw.githubusercontent.com instead
          # of the rate-limited GitHub REST API. Written only after the release
          # and every asset above are confirmed published.
          printf '%s\n' "$RELEASE_VERSION" > agent-latest.txt
          for attempt in {1..5}; do
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/agent-latest.txt" \
              --field message="Publish ${RELEASE_VERSION} as the latest stable Agent" \
              --field content="$(base64 -w0 agent-latest.txt)" \
              --field sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/agent-latest.txt" --jq '.sha' 2>/dev/null || true)" \
              --jq '.commit.sha' > /tmp/version-commit.sha 2>/tmp/version-error; then
              printf 'agent-latest.txt updated: %s\n' "$(cat /tmp/version-commit.sha)"
              exit 0
            fi
            # A concurrent update race returns 409; retry with a fresh sha.
            [[ "$attempt" < 5 ]] || { cat /tmp/version-error >&2; exit 1; }
            sleep 5
          done
