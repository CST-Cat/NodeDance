name: S09 terminal component acceptance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodedance-s09-terminal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terminal:
    name: S09 / Engine ${{ matrix.engine }} / Chromium and WebKit
    strategy:
      fail-fast: false
      matrix:
        engine: ['28', '29']
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODEDANCE_TEST_ENGINE: ${{ matrix.engine }}
      NODEDANCE_S09_DIND_SOCKET: ${{ github.workspace }}/.artifacts/dind/v${{ matrix.engine }}/socket/docker.sock
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked tools
        run: make verify-tools

      - name: Install locked web dependencies and build the embedded frontend
        run: make frontend

      - name: Start this job's owned Engine 28 or 29 DIND
        run: ./scripts/test/dind.sh start "${NODEDANCE_TEST_ENGINE}"

      - name: Run live Core-Agent-browser host PTY, Core authorization, and Docker Exec checks
        run: mkdir -p .artifacts/s09 && set -o pipefail && make test-terminal-component 2>&1 | tee ".artifacts/s09/terminal-component-engine-${NODEDANCE_TEST_ENGINE}.log"

      - name: Run responsive terminal keyboard and exact-target UI checks
        run: set -o pipefail && make test-terminal-browser PLAYWRIGHT_BROWSERS='chromium webkit' | tee ".artifacts/s09/terminal-browser-engine-${NODEDANCE_TEST_ENGINE}.log"

      - name: Stop only this job's owned DIND engine
        if: always()
        run: ./scripts/test/dind.sh stop "${NODEDANCE_TEST_ENGINE}"

      - name: Preserve S09 component test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s09-engine-${{ matrix.engine }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .artifacts/dind/v${{ matrix.engine }}/owner.json
            .artifacts/s09/
            web/test-results/
