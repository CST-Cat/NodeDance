name: Core release

on:
  push:
    tags:
      - 'core-v*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate bilingual release notes and explicit Agent pairing
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release-notes.py validate core "$RELEASE_VERSION" --agent-tag "$(cat agent-release.version)"
          python3 -m unittest discover -s scripts/tests

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build and verify shared Web assets once
        run: |
          pnpm --dir web install --frozen-lockfile
          make frontend
          tar -C internal/core/webassets -czf /tmp/core-webassets.tar.gz dist

      - name: Upload shared release inputs
        uses: actions/upload-artifact@v4
        with:
          name: core-release-inputs
          path: |
            /tmp/core-webassets.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build:
    name: Core native ${{ matrix.arch }} build, tests and image
    needs: prepare
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download shared Web assets
        uses: actions/download-artifact@v4
        with:
          name: core-release-inputs
          path: release-inputs

      - name: Restore shared Web assets
        run: tar -C internal/core/webassets -xzf release-inputs/core-webassets.tar.gz

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and execute native Core artifact
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$(go env GOHOSTARCH)" == "$EXPECTED_ARCH" ]]
          [[ "$(go env GOARCH)" == "$EXPECTED_ARCH" ]]
          [[ "$(go env GOOS)" == linux ]]
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" -o "dist/nodedance-linux-${EXPECTED_ARCH}" ./cmd/nodedance
          [[ "$("dist/nodedance-linux-${EXPECTED_ARCH}" --version)" == "NodeDance ${RELEASE_VERSION}" ]]
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" -o "dist/nodedance-updater-linux-${EXPECTED_ARCH}" ./cmd/nodedance-updater
          [[ "$("dist/nodedance-updater-linux-${EXPECTED_ARCH}" --version)" == "NodeDance Updater ${RELEASE_VERSION}" ]]

      - name: Run native Go tests including root Agent integration
        run: |
          set -euo pipefail
          sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" \
            "$(command -v go)" test -count=1 ./...

      - name: Upload tested native Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-linux-${{ matrix.arch }}
          path: |
            dist/nodedance-linux-${{ matrix.arch }}
            dist/nodedance-updater-linux-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Set up native image builder
        uses: docker/setup-buildx-action@v3

      - name: Resolve lowercase image name
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY_OWNER,,}/nodedance-core" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package tested native artifacts and push by digest
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.core
          target: release
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=min

      - name: Verify image contains the tested artifacts
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 scripts/release_images.py verify --component core --architecture "$EXPECTED_ARCH" \
            --image "$IMAGE@$DIGEST" --version "$RELEASE_VERSION" --artifacts dist
          mkdir -p image-digests
          printf '%s\n' "$DIGEST" > "image-digests/$EXPECTED_ARCH"

      - name: Upload verified image digest
        uses: actions/upload-artifact@v4
        with:
          name: core-image-${{ matrix.arch }}
          path: image-digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified Core release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download native Core artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: core-linux-*
          path: dist
          merge-multiple: true

      - name: Create compressed assets, installer, and checksums
        run: |
          set -euo pipefail
          chmod 0755 dist/nodedance-updater-linux-*
          dist/nodedance-updater-linux-amd64 manifest --component core --version "${{ github.ref_name }}" > dist/nodedance-update.json
          cp scripts/install-updater.sh dist/install-updater.sh
          test -f dist/nodedance-linux-amd64
          test -f dist/nodedance-linux-arm64
          chmod 0755 dist/nodedance-linux-amd64 dist/nodedance-linux-arm64
          (cd dist && tar -czf nodedance-linux-amd64.tar.gz nodedance-linux-amd64)
          (cd dist && tar -czf nodedance-linux-arm64.tar.gz nodedance-linux-arm64)
          cp scripts/install-core.sh dist/install-core.sh
          chmod 0755 dist/install-core.sh
          (cd dist && sha256sum \
            nodedance-linux-amd64 \
            nodedance-linux-arm64 \
            nodedance-linux-amd64.tar.gz \
            nodedance-linux-arm64.tar.gz nodedance-updater-linux-amd64 nodedance-updater-linux-arm64 nodedance-update.json install-updater.sh > SHA256SUMS)

      - name: Wait for the exact paired Agent and render final release notes
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          agent_tag=$(cat agent-release.version)
          mkdir -p release-inputs
          for attempt in {1..60}; do
            if gh api "repos/$RELEASE_REPOSITORY/releases/tags/$agent_tag" > /tmp/agent-release.json 2>/tmp/agent-release-error; then
              if python3 scripts/release-notes.py render core "$RELEASE_VERSION" --repository "$RELEASE_REPOSITORY" \
                --agent-tag "$agent_tag" --agent-release /tmp/agent-release.json --output release-inputs/core-release-notes.md; then
                exit 0
              fi
            elif ! grep -q 'HTTP 404' /tmp/agent-release-error; then
              cat /tmp/agent-release-error >&2
              exit 1
            fi
            echo "Waiting for published stable Agent $agent_tag ($attempt/60)"
            sleep 10
          done
          echo "Paired Agent $agent_tag was not published; Core publication stopped." >&2
          exit 1

      - name: Download verified native image digests
        uses: actions/download-artifact@v4
        with:
          pattern: core-image-*
          path: image-digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified multi-platform image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY_OWNER,,}/nodedance-core"
          amd64=$(cat image-digests/amd64)
          arm64=$(cat image-digests/arm64)
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ && "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "$image:$RELEASE_VERSION" "$image@$amd64" "$image@$arm64"
          docker buildx imagetools inspect "$image:$RELEASE_VERSION"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" \
            dist/nodedance-linux-amd64 \
            dist/nodedance-linux-arm64 \
            dist/nodedance-linux-amd64.tar.gz \
            dist/nodedance-linux-arm64.tar.gz \
            dist/install-core.sh \
            dist/nodedance-updater-linux-amd64 \
            dist/nodedance-updater-linux-arm64 \
            dist/nodedance-update.json \
            dist/install-updater.sh \
            dist/SHA256SUMS \
            --title "$RELEASE_VERSION" --verify-tag --latest=true --notes-file release-inputs/core-release-notes.md
