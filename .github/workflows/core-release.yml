name: Core release

on:
  push:
    tags:
      - 'core-v*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate bilingual release notes and explicit Agent pairing
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release-notes.py validate core "$RELEASE_VERSION" --agent-tag "$(cat agent-release.version)"
          python3 -m unittest discover -s scripts/tests

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build and verify shared Web assets once
        run: |
          pnpm --dir web install --frozen-lockfile
          make frontend
          tar -C internal/core/webassets -czf /tmp/core-webassets.tar.gz dist

      - name: Upload shared release inputs
        uses: actions/upload-artifact@v4
        with:
          name: core-release-inputs
          path: /tmp/core-webassets.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build:
    name: Native Core ${{ matrix.arch }} build and tests
    needs: prepare
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download shared Web assets
        uses: actions/download-artifact@v4
        with:
          name: core-release-inputs
          path: release-inputs

      - name: Restore shared Web assets
        run: tar -C internal/core/webassets -xzf release-inputs/core-webassets.tar.gz

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and execute native Core artifact
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$(go env GOHOSTARCH)" == "$EXPECTED_ARCH" ]]
          [[ "$(go env GOARCH)" == "$EXPECTED_ARCH" ]]
          [[ "$(go env GOOS)" == linux ]]
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" -o "dist/nodedance-linux-${EXPECTED_ARCH}" ./cmd/nodedance
          [[ "$("dist/nodedance-linux-${EXPECTED_ARCH}" --version)" == "NodeDance ${RELEASE_VERSION}" ]]

      - name: Run native Go tests including root Agent integration
        run: |
          set -euo pipefail
          sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" \
            "$(command -v go)" test -count=1 ./...

      - name: Upload tested native Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-linux-${{ matrix.arch }}
          path: dist/nodedance-linux-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish verified Core release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Require a passing release rehearsal
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          agent_tag=$(cat agent-release.version)
          python3 scripts/release-rehearsal.py check core "$RELEASE_VERSION" --agent-tag "$agent_tag"

      - name: Download native Core artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: core-linux-*
          path: dist
          merge-multiple: true

      - name: Create compressed assets, installer, and checksums
        run: |
          set -euo pipefail
          test -f dist/nodedance-linux-amd64
          test -f dist/nodedance-linux-arm64
          chmod 0755 dist/nodedance-linux-amd64 dist/nodedance-linux-arm64
          (cd dist && tar -czf nodedance-linux-amd64.tar.gz nodedance-linux-amd64)
          (cd dist && tar -czf nodedance-linux-arm64.tar.gz nodedance-linux-arm64)
          cp scripts/install-core.sh dist/install-core.sh
          chmod 0755 dist/install-core.sh
          (cd dist && sha256sum \
            nodedance-linux-amd64 \
            nodedance-linux-arm64 \
            nodedance-linux-amd64.tar.gz \
            nodedance-linux-arm64.tar.gz > SHA256SUMS)

      - name: Wait for the exact paired Agent and render final release notes
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          agent_tag=$(cat agent-release.version)
          mkdir -p release-inputs
          for attempt in {1..60}; do
            if gh api "repos/$RELEASE_REPOSITORY/releases/tags/$agent_tag" > /tmp/agent-release.json 2>/tmp/agent-release-error; then
              gh api --paginate "repos/$RELEASE_REPOSITORY/releases?per_page=100" \
                --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > /tmp/published-agent-tags
              python3 -c 'import re,sys; paired=sys.argv[1]; tags=[paired]+open("/tmp/published-agent-tags").read().splitlines(); valid=[t for t in tags if re.fullmatch(r"agent-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",t)]; latest=max(valid,key=lambda t:tuple(map(int,t[7:].split(".")))); sys.exit(0 if paired==latest else "Core pairing must use newest stable Agent: "+latest)' "$agent_tag"
              if python3 scripts/release-notes.py render core "$RELEASE_VERSION" --repository "$RELEASE_REPOSITORY" \
                --agent-tag "$agent_tag" --agent-release /tmp/agent-release.json --output release-inputs/core-release-notes.md; then
                exit 0
              fi
            elif ! grep -q 'HTTP 404' /tmp/agent-release-error; then
              cat /tmp/agent-release-error >&2
              exit 1
            fi
            echo "Waiting for published stable Agent $agent_tag ($attempt/60)"
            sleep 10
          done
          echo "Paired Agent $agent_tag was not published; Core publication stopped." >&2
          exit 1

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" \
            dist/nodedance-linux-amd64 \
            dist/nodedance-linux-arm64 \
            dist/nodedance-linux-amd64.tar.gz \
            dist/nodedance-linux-arm64.tar.gz \
            dist/install-core.sh \
            dist/SHA256SUMS \
            --title "$RELEASE_VERSION" --verify-tag --latest=true --notes-file release-inputs/core-release-notes.md

      - name: Publish the static latest-Core version file
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Installers read this file through raw.githubusercontent.com instead
          # of the rate-limited GitHub REST API. Written only after the release
          # and every asset above are confirmed published.
          printf '%s\n' "$RELEASE_VERSION" > core-latest.txt
          for attempt in {1..5}; do
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/core-latest.txt" \
              --field message="Publish ${RELEASE_VERSION} as the latest stable Core" \
              --field content="$(base64 -w0 core-latest.txt)" \
              --field sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/core-latest.txt" --jq '.sha' 2>/dev/null || true)" \
              --jq '.commit.sha' > /tmp/version-commit.sha 2>/tmp/version-error; then
              printf 'core-latest.txt updated: %s\n' "$(cat /tmp/version-commit.sha)"
              exit 0
            fi
            [[ "$attempt" < 5 ]] || { cat /tmp/version-error >&2; exit 1; }
            sleep 5
          done
