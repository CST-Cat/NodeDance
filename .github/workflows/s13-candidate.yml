name: NodeDance S13 candidate checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodedance-s13-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: S13 / isolated OpenSSH / API fixture / responsive Web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked Go, Node and pnpm
        run: make verify-tools

      - name: Install project dependencies and build Web assets
        run: make frontend

      - name: Install locked Chromium for the S13 component/API test
        run: make playwright-install PLAYWRIGHT_BROWSERS=chromium

      - name: Run S13 package, Core API and responsive browser checks against an isolated real OpenSSH daemon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server

          ssh_user=nodedance-s13-test
          test_dir="$RUNNER_TEMP/nodedance-s13-ssh"
          mkdir -m 0700 "$test_dir"
          ssh-keygen -q -t ed25519 -N '' -f "$test_dir/client-key"
          sudo useradd --create-home --shell /bin/bash "$ssh_user"
          test_password="$(openssl rand -base64 32)"
          printf '%s:%s\n' "$ssh_user" "$test_password" | sudo chpasswd
          unset test_password
          sudo usermod -aG sudo "$ssh_user"
          sudo install -d -m 0700 -o "$ssh_user" -g "$ssh_user" "/home/$ssh_user/.ssh"
          sudo install -m 0600 -o "$ssh_user" -g "$ssh_user" "$test_dir/client-key.pub" "/home/$ssh_user/.ssh/authorized_keys"
          printf '%s ALL=(ALL) NOPASSWD:ALL\n' "$ssh_user" | sudo tee /etc/sudoers.d/nodedance-s13-test >/dev/null
          sudo chmod 0440 /etc/sudoers.d/nodedance-s13-test
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -D -e -p 2222 \
            -o ListenAddress=127.0.0.1 \
            -o HostKey=/etc/ssh/ssh_host_ed25519_key \
            -o PubkeyAuthentication=yes \
            -o PasswordAuthentication=no \
            -o PermitRootLogin=no \
            -o UsePAM=no \
            -o StrictModes=yes \
            -o AllowUsers="$ssh_user" \
            -o AuthorizedKeysFile="/home/$ssh_user/.ssh/authorized_keys" \
            >"$test_dir/sshd.log" 2>&1 &
          sshd_pid=$!
          cleanup() {
            sudo kill "$sshd_pid" >/dev/null 2>&1 || true
            sudo userdel --remove "$ssh_user" >/dev/null 2>&1 || true
            sudo rm -f /etc/sudoers.d/nodedance-s13-test
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..30}; do
            if ssh-keyscan -p 2222 127.0.0.1 >"$test_dir/host-key" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1 || { cat "$test_dir/sshd.log"; exit 1; }

          export NODEDANCE_S13_TEST_SSH_PORT=2222
          export NODEDANCE_S13_TEST_SSH_USER="$ssh_user"
          export NODEDANCE_S13_TEST_SSH_PRIVATE_KEY_FILE="$test_dir/client-key"
          go test -count=1 ./internal/core/tailscale
          go test -count=1 ./internal/core/server -run TestTailscale
          PATH="$GITHUB_WORKSPACE/.tools/node-v22.23.3/bin:$GITHUB_WORKSPACE/.tools/pnpm/node_modules/.bin:$PATH" pnpm --dir web run typecheck
          PATH="$GITHUB_WORKSPACE/.tools/node-v22.23.3/bin:$GITHUB_WORKSPACE/.tools/pnpm/node_modules/.bin:$PATH" pnpm --dir web run test:s13

      - name: Preserve browser failure details
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s13-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            web/test-results/
            web/playwright-report/
