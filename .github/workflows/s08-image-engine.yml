name: NodeDance S08 real image Engine acceptance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodedance-s08-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-image-engine:
    name: S08 / real Registry and image lifecycle / Engine ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: ['28', '29']
    env:
      S08_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked Go, Node, pnpm and Compose tools
        run: make verify-tools

      - name: Install locked project dependencies
        run: make deps

      - name: Start this run's owner-marked DIND Engine ${{ matrix.engine }}
        run: scripts/test/s08-dind.sh start '${{ matrix.engine }}' "$S08_RUN_ID"

      - name: Run real Registry pull, digest, list, reference and delete acceptance
        run: scripts/test/s08-image-engine-dind.sh '${{ matrix.engine }}' "$S08_RUN_ID"

      - name: Remove only this run's marked Engine ${{ matrix.engine }}
        if: always()
        run: |
          marker=".artifacts/s08/dind/v${{ matrix.engine }}/$S08_RUN_ID/owner.json"
          if [[ -f "$marker" ]]; then scripts/test/s08-dind.sh clean '${{ matrix.engine }}' "$S08_RUN_ID" --purge-data; fi

      - name: Preserve real Engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s08-image-engine${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .artifacts/s08/
