name: NodeDance stage acceptance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodedance-stages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  s00:
    name: S00 / ${{ matrix.runner }} / Engine ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            engine: '28'
          - runner: ubuntu-24.04
            engine: '29'
          - runner: ubuntu-24.04-arm
            engine: '28'
          - runner: ubuntu-24.04-arm
            engine: '29'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      NODEDANCE_TEST_ENGINE: ${{ matrix.engine }}
      NODEDANCE_TEST_RUNNER: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize fresh S00 evidence without checkout-time results
        run: rm -f reports/stages/S00.json reports/status.json && python3 scripts/ci_evidence.py initialize

      - name: Install and verify locked Go, Node, native pnpm and Compose tools
        run: make verify-tools

      - name: Verify per-run report and artifact safeguards
        run: make verify-ci-evidence

      - name: Run checks, dual-architecture builds and three full S00 acceptance passes
        run: make test-stage STAGE=S00

      - name: Attach current GitHub run metadata to S00 report
        if: always()
        run: python3 scripts/ci_evidence.py annotate

      - name: Prepare evidence directories
        if: always()
        run: mkdir -p reports/stages .artifacts/logs/acceptance .artifacts/stage-runs

      - name: Preserve structured reports and raw acceptance logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s00-${{ matrix.runner }}-engine-${{ matrix.engine }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            reports/stages/S00.json
            reports/status.json
            .artifacts/logs/acceptance/
            .artifacts/stage-runs/

  s01:
    name: S01 / ubuntu-24.04 / Chromium, WebKit, Firefox
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NODEDANCE_TEST_RUNNER: ubuntu-24.04
      NODEDANCE_PLAYWRIGHT_PROJECTS: chromium,webkit,firefox
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize fresh S01 evidence without checkout-time results
        run: rm -f reports/stages/S01.json reports/status.json && python3 scripts/ci_evidence.py --stage S01 initialize

      - name: Install and verify locked Go, Node, native pnpm and Compose tools
        run: make verify-tools

      - name: Verify per-run report and artifact safeguards
        run: make verify-ci-evidence

      - name: Install locked project dependencies
        run: make deps

      - name: Install browsers for locked Playwright
        run: make playwright-install

      - name: Run checks, dual-architecture builds and three full S01 acceptance passes
        run: make test-stage STAGE=S01

      - name: Attach current GitHub run metadata to S01 report
        if: always()
        run: python3 scripts/ci_evidence.py --stage S01 annotate

      - name: Prepare evidence directories
        if: always()
        run: mkdir -p reports/stages .artifacts/logs/acceptance-s01 .artifacts/stage-runs

      - name: Preserve structured reports and sanitized acceptance logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s01-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            reports/stages/S01.json
            reports/status.json
            .artifacts/logs/acceptance-s01/
            .artifacts/stage-runs/

  s02:
    name: S02 / ${{ matrix.runner }} / real Core + Agent + systemd
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      NODEDANCE_TEST_RUNNER: ${{ matrix.runner }}
      NODEDANCE_SYSTEMD_ACCEPTANCE: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize fresh S02 evidence
        run: rm -f reports/stages/S02.json && python3 scripts/ci_evidence.py --stage S02 initialize

      - name: Install and verify locked Go, Node, native pnpm and Compose tools
        run: make verify-tools

      - name: Verify per-run report and artifact safeguards
        run: make verify-ci-evidence

      - name: Install locked project dependencies
        run: make deps

      - name: Run checks, dual-architecture builds and three full S02 acceptance passes
        run: make test-stage STAGE=S02

      - name: Attach current GitHub run metadata to S02 report
        if: always()
        run: python3 scripts/ci_evidence.py --stage S02 annotate

      - name: Prepare evidence directories
        if: always()
        run: mkdir -p reports/stages .artifacts/logs/acceptance-s02 .artifacts/stage-runs

      - name: Preserve structured reports and S02 per-case logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s02-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            reports/stages/S02.json
            reports/status.json
            .artifacts/logs/acceptance-s02/
            .artifacts/stage-runs/

  s03:
    name: S03 / ${{ matrix.runner }} / real Core-Agent-guest-browser
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            qemu-package: qemu-system-x86
          - runner: ubuntu-24.04-arm
            qemu-package: qemu-system-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      NODEDANCE_TEST_RUNNER: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize fresh S03 evidence
        run: rm -f reports/stages/S03.json && python3 scripts/ci_evidence.py --stage S03 initialize

      - name: Install and verify locked Go, Node, native pnpm and Compose tools
        run: make verify-tools

      - name: Verify report safeguards and acceptance self-tests
        run: make verify-ci-evidence

      - name: Install locked project dependencies
        run: make deps

      - name: Install browsers for locked Playwright
        run: make playwright-install

      - name: Install architecture-matched locked QEMU and NBD support
        run: |
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades \
            qemu-utils=1:8.2.2+ds-0ubuntu1.18 \
            ubuntu-keyring=2023.11.28.1 \
            gpgv=2.4.4-2ubuntu17.6 \
            cpio=2.15+dfsg-1ubuntu2.1 \
            gzip=1.12-1ubuntu3.2 \
            initramfs-tools-core=0.142ubuntu25.8 \
            util-linux=2.39.3-9ubuntu6.6 \
            '${{ matrix.qemu-package }}=1:8.2.2+ds-0ubuntu1.18'
          sudo modprobe nbd max_part=8

      - name: Run checks and dual-architecture release builds
        run: |
          make check
          make build

      - name: Run three complete S03 guest and browser acceptance passes
        run: python3 scripts/acceptance-s03.py --mode full --repeat 3 --ci-runner '${{ matrix.runner }}'

      - name: Attach current GitHub run metadata to S03 report
        if: always()
        run: python3 scripts/ci_evidence.py --stage S03 annotate

      - name: Prepare S03 evidence directories
        if: always()
        run: mkdir -p reports/stages .artifacts/logs/acceptance-s03 .artifacts/work-s03/guest-agent .artifacts/work-s03/rounds

      - name: Preserve S03 reports and guest, round and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s03-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            reports/stages/S03.json
            reports/status.json
            .artifacts/logs/acceptance-s03/
            .artifacts/work-s03/guest-agent/**/browser/engine-*.json
            .artifacts/work-s03/guest-agent/**/browser/guest-phase.json
            .artifacts/work-s03/guest-agent/**/browser/playwright.log
            .artifacts/work-s03/*/summary.json
            .artifacts/work-s03/*/round-*/serial.log
            .artifacts/work-s03/*/round-*/commands.log
            .artifacts/work-s03/*/round-*/agent-core-states.jsonl
            .artifacts/work-s03/*/round-*/guest-clock-reboot.json
            .artifacts/work-s03/*/round-*/cpu-memory-load.json

  s04:
    name: S04 / ${{ matrix.runner }} / Engine ${{ matrix.engine }} / real Core-Agent-browser
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            engine: '28'
          - runner: ubuntu-24.04
            engine: '29'
          - runner: ubuntu-24.04-arm
            engine: '28'
          - runner: ubuntu-24.04-arm
            engine: '29'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      NODEDANCE_TEST_ENGINE: ${{ matrix.engine }}
      NODEDANCE_TEST_RUNNER: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize fresh S04 evidence
        run: rm -f reports/stages/S04.json && python3 scripts/ci_evidence.py --stage S04 initialize

      - name: Install and verify locked Go, Node, native pnpm and Compose tools
        run: make verify-tools

      - name: Verify per-run report and artifact safeguards
        run: make verify-ci-evidence

      - name: Install locked project dependencies
        run: make deps

      - name: Install locked Chromium browser for the real embedded UI test
        run: make playwright-install PLAYWRIGHT_BROWSERS=chromium

      - name: Run checks, dual-architecture builds and three full S04 acceptance passes
        run: make test-stage STAGE=S04

      - name: Attach current GitHub run metadata to S04 report
        if: always()
        run: python3 scripts/ci_evidence.py --stage S04 annotate

      - name: Prepare S04 evidence directories
        if: always()
        run: mkdir -p reports/stages .artifacts/logs/acceptance-s04 .artifacts/stage-runs

      - name: Preserve structured reports and sanitized per-case logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s04-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-engine-${{ matrix.engine }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            reports/stages/S04.json
            reports/status.json
            .artifacts/logs/acceptance-s04/
            .artifacts/stage-runs/
