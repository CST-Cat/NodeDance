name: NodeDance S16 Agent update candidate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodedance-s16-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: S16 / signed update helper / rollout API / responsive Web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked Go, Node and pnpm
        run: make verify-tools

      - name: Build embedded Web assets and install dependencies
        run: make frontend

      - name: Install locked Chromium
        run: make playwright-install PLAYWRIGHT_BROWSERS=chromium

      - name: Run S16 signed release, helper, rollout and responsive UI tests
        shell: bash
        run: |
          mkdir -p .artifacts/logs/s16
          set -o pipefail
          make test-s16 2>&1 | tee .artifacts/logs/s16/candidate.log

      - name: Preserve S16 report and failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s16-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            reports/stages/S16.json
            .artifacts/logs/s16/
            web/test-results/
            web/playwright-report/
