name: NodeDance S14 service-probe candidate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodedance-s14-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: S14 / Agent probes / Core persistence / responsive Web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked Go, Node and pnpm
        run: make verify-tools

      - name: Install project dependencies and build Web assets
        run: make frontend

      - name: Install locked Chromium for the responsive browser check
        run: make playwright-install PLAYWRIGHT_BROWSERS=chromium

      - name: Run the S14 candidate suite three consecutive times
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/logs/s14
          for attempt in 1 2 3; do
            log_path=".artifacts/logs/s14/attempt-${attempt}.log"
            make test-s14 2>&1 | tee "$log_path"
          done

      - name: Preserve S14 report and browser failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s14-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            reports/stages/S14.json
            .artifacts/logs/s14/
            web/test-results/
            web/playwright-report/
