name: NodeDance S10 file manager checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodedance-s10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  s10:
    name: S10 / file transfer components and Chromium, WebKit, Firefox mocks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked Go, Node, pnpm, and browser tools
        run: |
          make verify-tools
          python3 - <<'PY' >> "$GITHUB_PATH"
          import json, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          lock = json.loads((root / "toolchain.lock.json").read_text())
          print(root / f".tools/go{lock['go']['version']}/bin")
          print(root / f".tools/node-v{lock['node']['version']}/bin")
          print(root / ".tools/pnpm/node_modules/.bin")
          PY

      - name: Install locked project dependencies
        run: make deps

      - name: Run one live Core-Agent-host-filesystem integration test
        run: |
          mkdir -p .artifacts/logs/acceptance-s10
          set -o pipefail
          GOTOOLCHAIN=local go test -v -count=1 -run '^TestRealAgentHostFilesAPIEndToEnd$' ./internal/core/server 2>&1 \
            | tee .artifacts/logs/acceptance-s10/real-core-agent-host-files.log

      - name: Install the S10 Playwright browsers
        run: make playwright-install

      - name: Run one focused S10 component and mocked browser pass
        run: |
          export GOTOOLCHAIN=local
          python3 scripts/acceptance-s10.py --mode full --repeat 1

      - name: Preserve NOT_READY report and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s10-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            reports/stages/S10.json
            reports/status.json
            .artifacts/logs/acceptance-s10/
            web/test-results/
