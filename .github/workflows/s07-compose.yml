name: NodeDance S07 Compose acceptance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodedance-s07-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compose-dind:
    name: S07 / real Compose / Engine ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: ['28', '29']
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked Go, Node, pnpm and Compose plugin
        run: make verify-tools

      - name: Install locked project dependencies
        run: make deps

      - name: Start this job's marked DIND fixture
        run: scripts/test/dind.sh start "${{ matrix.engine }}"

      - name: Run real Compose and Engine lifecycle acceptance
        run: scripts/test/s07-compose-dind.sh "${{ matrix.engine }}"

      - name: Remove only this job's marked DIND fixture
        if: always()
        run: |
          marker=".artifacts/dind/v${{ matrix.engine }}/owner.json"
          if [[ -f "$marker" ]]; then scripts/test/dind.sh clean "${{ matrix.engine }}"; fi

      - name: Preserve Compose DIND test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s07-compose-engine${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .artifacts/s07/
