name: NodeDance signed release bundles

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodedance-s17-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-core-systemd-install:
    name: S17 Core systemd install, health, uninstall, and data preservation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked build tools
        run: make verify-tools

      - name: Build the embedded frontend
        run: make frontend

      - name: Detect a controllable systemd manager
        id: systemd
        shell: bash
        run: |
          if [[ "$(ps -p 1 -o comm= | tr -d ' ')" == systemd ]] && command -v systemctl >/dev/null 2>&1 && systemctl show-environment >/dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install, health-check, and uninstall a real signed Core release
        if: steps.systemd.outputs.available == 'true'
        env:
          GO_BIN: ${{ github.workspace }}/.tools/go1.26.8/bin/go
        run: scripts/test/s17-release-systemd.sh

      - name: Report systemd acceptance as NOT_READY
        if: steps.systemd.outputs.available != 'true'
        run: |
          echo 'S17-10 SYSTEMD NOT_READY: this GitHub runner does not expose a controllable systemd manager; the --no-service signed install/uninstall tests still ran in the architecture matrix.'

  install-and-verify:
    name: S17 release install/uninstall / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked build tools
        run: make verify-tools

      - name: Run signed bundle, architecture, install, and uninstall tests
        env:
          GO_BIN: ${{ github.workspace }}/.tools/go1.26.8/bin/go
        run: scripts/test/s17-release-selftest.sh

      - name: Check patch formatting
        run: git diff --check

  signed-release-bundles:
    name: Build signed Linux amd64/arm64 bundles
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked build tools
        run: make verify-tools

      - name: Write signing material to private temporary files
        env:
          RELEASE_PRIVATE_KEY_BASE64: ${{ secrets.NODEDANCE_RELEASE_PRIVATE_KEY_BASE64 }}
          RELEASE_PUBLIC_KEY_BASE64: ${{ vars.NODEDANCE_RELEASE_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PRIVATE_KEY_BASE64" || { echo 'NODEDANCE_RELEASE_PRIVATE_KEY_BASE64 secret is required for version tags' >&2; exit 1; }
          test -n "$RELEASE_PUBLIC_KEY_BASE64" || { echo 'NODEDANCE_RELEASE_PUBLIC_KEY_BASE64 repository variable is required for version tags' >&2; exit 1; }
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/nodedance-release-signing"
          printf '%s' "$RELEASE_PRIVATE_KEY_BASE64" > "$RUNNER_TEMP/nodedance-release-signing/private.key"
          printf '%s' "$RELEASE_PUBLIC_KEY_BASE64" > "$RUNNER_TEMP/nodedance-release-signing/public.key"
          unset RELEASE_PRIVATE_KEY_BASE64 RELEASE_PUBLIC_KEY_BASE64

      - name: Build and verify signed architecture bundles
        env:
          GO_BIN: ${{ github.workspace }}/.tools/go1.26.8/bin/go
        run: |
          scripts/release/build-linux-bundles.sh \
            "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/nodedance-release-signing/private.key" \
            "$RUNNER_TEMP/nodedance-release-signing/public.key" \
            "$RUNNER_TEMP/nodedance-release-output"

      - name: Preserve signed bundles and installer tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-${{ github.ref_name }}-linux-bundles
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/nodedance-release-output/${{ github.ref_name }}/*.tar.gz
            scripts/release/install.sh
            scripts/release/uninstall.sh
            scripts/release/operations.py
            scripts/release/README.md

      - name: Remove signing files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/nodedance-release-signing"
