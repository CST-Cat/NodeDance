name: NodeDance S06 responsive dashboard candidate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodedance-s06-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: S06 / HTTPS preference restart / responsive dashboard Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked Go, Node and pnpm
        run: make verify-tools

      - name: Run candidate runner contract tests
        run: python3 scripts/test/test_acceptance_candidates.py

      - name: Run S06 candidates once and verify only S06-03 is reported PASS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/logs/s06
          set +e
          make test-stage STAGE=S06 2>&1 | tee .artifacts/logs/s06/stage-runner.log
          stage_exit=${PIPESTATUS[0]}
          set -e
          test "$stage_exit" -eq 2
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/stages/S06.json").read_text())
          assert report["status"] == "NOT_READY", report["status"]
          assert report["candidate_status"] == "PASS", report.get("candidate_status")
          checks = report["candidate_checks"]
          assert len(checks) == 1, len(checks)
          assert checks[0]["invocations"] == 1, checks[0]
          assert checks[0]["status"] == "PASS", checks[0]
          assert checks[0]["command"] == ["make", "test-candidate-s06"], checks[0]
          assert len(report["tests"]) == 12, len(report["tests"])
          preference = report["tests"]["S06-03"]
          assert preference["status"] == "PASS", preference
          assert len(preference["runs"]) == 1, preference["runs"]
          assert preference["runs"][0]["attempt"] == 1, preference["runs"]
          assert preference["runs"][0]["status"] == "PASS", preference["runs"]
          assert preference["runs"][0]["test_name"] == "TestS06PreferencePersistenceAcrossCoreRestart", preference["runs"]
          other_cases = {case_id: case for case_id, case in report["tests"].items() if case_id != "S06-03"}
          assert len(other_cases) == 11, len(other_cases)
          assert all(case["status"] == "NOT_READY" and not case["runs"] for case in other_cases.values())
          evidence = Path(checks[0]["evidence"])
          assert evidence.is_file(), str(evidence)
          preference_evidence = Path(preference["runs"][0]["evidence"])
          assert preference_evidence == evidence, (preference_evidence, evidence)
          candidate_log = evidence.read_text()
          assert "S06-03_PREFERENCE_RESTART_PASS target=container visible=false pinned=true api_fields_verified=true sqlite_fields_verified=true restart_same_data_dir=true" in candidate_log
          print("S06-03 real persistence PASS once; responsive candidate PASS once; 11 other normative cases remain NOT_READY; stage NOT_READY")
          PY

      - name: Preserve S06 report, runner logs and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s06-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            reports/stages/S06.json
            reports/status.json
            .artifacts/logs/s06/
            .artifacts/logs/acceptance-s06/
            web/test-results/
            web/playwright-report/
