name: NodeDance S06 responsive dashboard candidate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodedance-s06-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: S06 / Engine 29 / Core-Agent dashboard and touch browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      S06_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked Go, Node and pnpm
        run: make verify-tools

      - name: Run candidate runner contract tests
        run: python3 scripts/test/test_acceptance_candidates.py

      - name: Start this run's owner-marked Engine 29 DIND
        shell: bash
        run: |
          set -euo pipefail
          scripts/test/s06-dind.sh start "$S06_RUN_ID"
          dind_root="$GITHUB_WORKSPACE/.artifacts/s06/dind/v29/$S06_RUN_ID"
          printf 'NODEDANCE_S06_RUN_ID=%s\n' "$S06_RUN_ID" >> "$GITHUB_ENV"
          printf 'NODEDANCE_S06_DIND_ROOT=%s\n' "$dind_root" >> "$GITHUB_ENV"
          printf 'NODEDANCE_S06_DIND_HOST=unix://%s/socket/docker.sock\n' "$dind_root" >> "$GITHUB_ENV"

      - name: Run S06 candidates once and verify exact partial evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/logs/s06
          set +e
          make test-stage STAGE=S06 2>&1 | tee .artifacts/logs/s06/stage-runner.log
          stage_exit=${PIPESTATUS[0]}
          set -e
          test "$stage_exit" -eq 2
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/stages/S06.json").read_text())
          assert report["status"] == "NOT_READY", report["status"]
          assert report["candidate_status"] == "PASS", report.get("candidate_status")
          checks = report["candidate_checks"]
          assert len(checks) == 1, len(checks)
          assert checks[0]["invocations"] == 1, checks[0]
          assert checks[0]["status"] == "PASS", checks[0]
          assert checks[0]["command"] == ["make", "test-candidate-s06"], checks[0]
          assert len(report["tests"]) == 12, len(report["tests"])
          exact_tests = {
              "S06-01": "TestS06RealDashboardOwnedDINDResponsiveAndTouch/S06-01_fused_overview_caps_at_four_and_detail_has_all_40",
              "S06-03": "TestS06PreferencePersistenceAcrossCoreRestart",
              "S06-11": "TestS06RealDashboardOwnedDINDResponsiveAndTouch/S06-11_embedded_page_has_no_overflow_at_375_768_1440",
              "S06-12": "TestS06RealDashboardOwnedDINDResponsiveAndTouch/S06-12_touch_reorder_persists_through_authenticated_core_api",
          }
          for case_id, test_name in exact_tests.items():
              case = report["tests"][case_id]
              assert case["status"] == "PASS", (case_id, case)
              assert len(case["runs"]) == 1, (case_id, case["runs"])
              assert case["runs"][0]["attempt"] == 1, (case_id, case["runs"])
              assert case["runs"][0]["status"] == "PASS", (case_id, case["runs"])
              assert case["runs"][0]["test_name"] == test_name, (case_id, case["runs"])
          other_cases = {case_id: case for case_id, case in report["tests"].items() if case_id not in exact_tests}
          assert len(other_cases) == 8, len(other_cases)
          assert all(case["status"] == "NOT_READY" and not case["runs"] for case in other_cases.values())
          evidence = Path(checks[0]["evidence"])
          assert evidence.is_file(), str(evidence)
          for case_id in exact_tests:
              case_evidence = Path(report["tests"][case_id]["runs"][0]["evidence"])
              assert case_evidence == evidence, (case_id, case_evidence, evidence)
          candidate_log = evidence.read_text()
          assert "S06-03_PREFERENCE_RESTART_PASS target=container visible=false pinned=true api_fields_verified=true sqlite_fields_verified=true restart_same_data_dir=true" in candidate_log
          for marker in [
              "S06-01_REAL_BROWSER_PASS baseline=0 engine_owned_containers=40 featured_cards=4 detail_rows=40 api_inventory=40 exact_run_ids=true",
              "S06-11_REAL_BROWSER_PASS embedded_core=true widths=375,768,1440 overview_and_docker_detail_checked=true overflows=0",
              "S06-12_REAL_TOUCH_REORDER_PASS pointer_type=touch",
              "S06_FIXTURE_CLEANUP_PASS removed=40 owner_marked=true baseline_retained=0 foreign_resources_touched=0",
          ]:
              assert marker in candidate_log, marker
          evidence_dir = Path(".artifacts/s06/evidence/v29") / "${{ github.run_id }}-${{ github.run_attempt }}"
          screenshots = sorted(evidence_dir.glob("*.png"))
          assert len(screenshots) == 7, (evidence_dir, len(screenshots))
          print("S06-01/-03/-11/-12 real evidence PASS once; eight unexecuted normative cases remain NOT_READY; stage NOT_READY")
          PY

      - name: Remove only this run's owner-marked Engine 29 and data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          marker=".artifacts/s06/dind/v29/$S06_RUN_ID/owner.json"
          if [[ -f "$marker" ]]; then scripts/test/s06-dind.sh clean "$S06_RUN_ID" --purge-data; fi

      - name: Preserve S06 report, runner logs and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s06-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            reports/stages/S06.json
            reports/status.json
            .artifacts/logs/s06/
            .artifacts/logs/acceptance-s06/
            .artifacts/s06/evidence/
            .artifacts/s06/dind/
            web/test-results/
            web/playwright-report/
