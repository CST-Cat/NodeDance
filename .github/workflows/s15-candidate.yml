name: NodeDance S15 alerts candidate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodedance-s15-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: S15 / durable alert lifecycle / controlled Webhook and SMTP / responsive Web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and verify locked Go, Node and pnpm
        run: make verify-tools

      - name: Install dependencies and build embedded Web assets
        run: make frontend

      - name: Install locked Chromium
        run: make playwright-install PLAYWRIGHT_BROWSERS=chromium

      - name: Run S15 durable evaluation, delivery and responsive-browser tests
        shell: bash
        run: |
          mkdir -p .artifacts/logs/s15
          set -o pipefail
          make test-s15 2>&1 | tee .artifacts/logs/s15/candidate.log

      - name: Preserve report and browser failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodedance-s15-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            reports/stages/S15.json
            .artifacts/logs/s15/
            web/test-results/
            web/playwright-report/
